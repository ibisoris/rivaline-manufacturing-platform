[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rivaline-manufacturing-platform"
version = "0.1.0"
description = "Synthetic manufacturing integration case study — Phase 1 foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3",
  "pandas>=2.2,<3", "scikit-learn>=1.5,<2",
  "openpyxl>=3.1,<4", "alembic>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.9,<1", "pyyaml>=6,<7", "jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
include = ["api*", "database*", "etl*", "analytics*", "planning*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
